<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>一掷千金 · 抖音小游戏预览</title>
    <link rel="icon" href="data:,">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #07070f;
        }
        #game-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            touch-action: none;
            cursor: pointer;
        }
        #preview-toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            max-width: 80vw;
            padding: 9px 16px;
            border-radius: 18px;
            background: rgba(10, 10, 22, 0.94);
            border: 1px solid rgba(255, 212, 94, 0.32);
            color: #f6f6ff;
            font: 12px/1.4 "PingFang SC", "Microsoft YaHei", sans-serif;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 10;
        }
    </style>
</head>
<body>
    <canvas id="game-canvas"></canvas>
    <script src="browser-tt.js"></script>
    <script src="bundle.js"></script>
    <script src="demo.js"></script>
</body>
</html>
